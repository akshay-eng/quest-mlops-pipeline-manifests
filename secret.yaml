# Apply this manually once — never commit real values to git.
# kubectl apply -f secret.yaml  (after filling in the base64 values)
#
# Generate base64:  echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: evidently-secret
  namespace: quest-mlops
type: Opaque
data:
  api_key: REPLACE_WITH_BASE64_ENCODED_EVIDENTLY_API_KEY
