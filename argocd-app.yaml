# Apply this to your ArgoCD namespace once:
#   kubectl apply -f argocd-app.yaml -n argocd
#
# ArgoCD will then watch quest-mlops-pipeline-manifests and auto-sync
# any changes (e.g. image tag bumps from the GitHub Actions pipeline).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quest-mlops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/akshay-eng/quest-mlops-pipeline-manifests.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: quest-mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
